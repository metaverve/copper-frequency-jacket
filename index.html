<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Copper Frequency Jacket</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#0c0c0c;color:#f0f0f0}header{text-align:center;padding:2rem 1rem;border-bottom:1px solid #c9a227}h1{color:#c9a227;margin:0;letter-spacing:.06em}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;padding:1rem;background:#111;position:sticky;top:0}button{padding:.8rem 1.2rem;background:transparent;color:#fff;border:1px solid #333;border-radius:6px}button.active{background:#c9a227;color:#000}section{display:none;max-width:1000px;margin:0 auto;padding:1.5rem}section.show{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.2rem}.card{background:#161616;border:1px solid #222;border-radius:12px;padding:1rem;text-align:center}svg{width:100%;height:auto;max-height:420px;background:#000;border-radius:8px}h3{color:#c9a227;margin:.8rem 0 .3rem}.desc{color:#aaa;font-size:.9rem;line-height:1.5}</style></head><body><header><h1>COPPER FREQUENCY</h1></header><nav><button class="active" onclick="show('men')">Men’s Line</button><button onclick="show('women')">Women’s Line</button></nav><section id="men" class="show"><div class="grid"><div class="card"><h3>Randy Racer</h3><svg viewBox="0 0 400 520"><path d="M70 90 L330 90 L360 160 L340 480 L60 480 L40 160 Z" fill="#f8f8f8" stroke="#111" stroke-width="3"/><rect x="20" y="180" width="50" height="16" fill="#e00"/><rect x="20" y="204" width="50" height="16" fill="#e00"/><rect x="330" y="180" width="50" height="16" fill="#e00"/><rect x="330" y="204" width="50" height="16" fill="#e00"/><circle cx="140" cy="180" r="16" fill="#111" stroke="#c9a227" stroke-width="3"/><circle cx="260" cy="180" r="16" fill="#111" stroke="#c9a227" stroke-width="3"/><path d="M140 180 Q200 210 260 180" fill="none" stroke="#c9a227" stroke-width="2"/></svg><p class="desc">White F1 with red sleeve stripes and copper circuits.</p></div><div class="card"><h3>Líptė Rähł</h3><svg viewBox="0 0 400 520"><path d="M70 90 L330 90 L360 160 L340 480 L60 480 L40 160 Z" fill="#111" stroke="#333" stroke-width="3"/><rect x="20" y="180" width="50" height="16" fill="#e00"/><rect x="20" y="204" width="50" height="16" fill="#e00"/><rect x="330" y="180" width="50" height="16" fill="#e00"/><rect x="330" y="204" width="50" height="16" fill="#e00"/><circle cx="140" cy="180" r="16" fill="#000" stroke="#c9a227" stroke-width="3"/><circle cx="260" cy="180" r="16" fill="#000" stroke="#c9a227" stroke-width="3"/></svg><p class="desc">Black base with red stripes and copper frequency system.</p></div></div></section><section id="women"><div class="grid"><div class="card"><h3>Luna</h3><svg viewBox="0 0 400 520"><path d="M80 100 L320 100 L345 165 L330 470 L70 470 L55 165 Z" fill="#fafafa" stroke="#111" stroke-width="3"/><rect x="30" y="185" width="45" height="14" fill="#e63946"/><rect x="30" y="206" width="45" height="14" fill="#e63946"/><rect x="325" y="185" width="45" height="14" fill="#e63946"/><rect x="325" y="206" width="45" height="14" fill="#e63946"/><circle cx="150" cy="185" r="14" fill="#111" stroke="#c9a227" stroke-width="2"/><circle cx="250" cy="185" r="14" fill="#111" stroke="#c9a227" stroke-width="2"/></svg><p class="desc">Women’s Randy Racer — tailored white F1.</p></div></div></section><script>function show(id){document.querySelectorAll('section').forEach(s=>s.className='');document.getElementById(id).className='show';document.querySelectorAll('button').forEach(b=>b.className='');event.target.className='active';}</script></body></html>
